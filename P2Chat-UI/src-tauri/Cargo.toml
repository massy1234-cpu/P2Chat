[package]
name = "p2chat-ui"
version = "0.1.0"
description = "P2Chat desktop UI"
edition = "2021"

[lib]
name = "p2chat_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
