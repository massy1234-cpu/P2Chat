// protoc --go_out=. --go_opt=module=P2Chat cmd/client/internals/proto/bundle_request/bundle_request.proto
syntax = "proto3";

package bundlerequest;

option go_package = "P2Chat/cmd/client/internals/proto_generated/bundle_request_structs";

import "cmd/server/internals/proto/pqxdh/bundle.proto";

message BundleRequest {
    bytes nickname = 1;
    repeated bytes nicknames = 2;
}

message BundleResponse {
    proto_server_bundle.UserBundle bundle = 2;
    repeated proto_server_bundle.UserBundle bundles = 3;
}

message BundleAvailabilityResponse {
    bytes nickname = 1;
    bool present = 2;
}
