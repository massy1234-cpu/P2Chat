// protoc --go_out=. --go_opt=module=P2Chat cmd/client/internals/proto/mldsa/mldsa_proto.proto

syntax = "proto3";

package proto_struct_mldsa;
import "cmd/client/internals/proto/argon_params.proto";

option go_package = "P2Chat/cmd/client/internals/proto_generated/mldsa/proto_struct_mldsa";		// specify where put the generated file

// struct for the private key MLDSA
message PrivateKeyMLDSA {
    bytes p2chat_version = 1;
    string algorithm = 2;
    int64 timestamp = 3;
    bytes nonce = 4;
    bytes key = 5;
    proto.ArgonParams argon_params = 6;
	bytes checksum = 7;
}

// struct for the public key MLDSA
message PublicKeyMLDSA {
	string algorithm = 1;
	string p2chat_version = 2;
	uint32 timestamp = 3;
	bytes key = 4;
	bytes checksum = 5;
}
